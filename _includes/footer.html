<footer class="d-flex w-100 justify-content-center">
  <div class="d-flex flex-column justify-content-between align-items-center text-muted">
    
    <div class="footer-stats d-flex align-items-center mt-2 mb-2">
      <i class="far fa-eye fa-fw me-1"></i>
      <span>本站总访问量: </span>
      <span id="busuanzi_value_site_pv" style="margin-left: 5px; font-weight: bold;">加载中...</span>
    </div>

    <div class="footer-copy">
      {% if site.social.name %}
        &copy; {{ 'now' | date: '%Y' }}
        <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
      {% endif %}
      <span>保留部分权利。</span>
    </div>

    <div class="footer-theme">
      <p class="mb-0">
        {{ site.data.locales[site.lang].meta.powered_by | replace: ':Jekyll', '<a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a>' | replace: ':theme', '<a href="https://github.com/cotes2020/jekyll-theme-chirpy" target="_blank" rel="noopener">Chirpy</a>' }}
      </p>
    </div>
  </div>
</footer>

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
